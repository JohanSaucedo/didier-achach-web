const AR=912/1440;

const canvas=document.getElementById("c");
let W=innerWidth,H=innerHeight;
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setSize(W,H);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,W/H,0.1,200);
camera.position.z=9;

window.addEventListener("resize",()=>{
  W=innerWidth;H=innerHeight;
  camera.aspect=W/H;camera.updateProjectionMatrix();renderer.setSize(W,H);
});

// Iluminacion suave
scene.add(new THREE.AmbientLight(0xffffff,.9));
const lA=new THREE.PointLight(0xe63535,1.5,20);lA.position.set(-4,3,5);scene.add(lA);
const lB=new THREE.PointLight(0xf5de00,1.2,20);lB.position.set(4,-3,5);scene.add(lB);
const lC=new THREE.PointLight(0x4a9e2f,1.0,15);lC.position.set(0,5,3);scene.add(lC);

// Grupo principal — todo el atomo
const atomGroup=new THREE.Group();
scene.add(atomGroup);

// === NUCLEO: Logo ===
const logoGroup=new THREE.Group();
atomGroup.add(logoGroup);

const img=new Image();
img.onload=()=>{
  const tex=new THREE.Texture(img);tex.needsUpdate=true;
  const mat=new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.DoubleSide});
  const logo=new THREE.Mesh(new THREE.PlaneGeometry(3.2,3.2*AR),mat);
  logo.position.z=.05;logoGroup.add(logo);
  // Glow capas detras
  [.14,.07,.035].forEach((op,i)=>{
    const s=1+i*.12;
    const gm=new THREE.Mesh(new THREE.PlaneGeometry(3.2*s,3.2*AR*s),
      new THREE.MeshBasicMaterial({map:tex,transparent:true,opacity:op,side:THREE.DoubleSide}));
    gm.position.z=-(i+1)*.15;logoGroup.add(gm);
  });
};
img.src=LOGO;

// === ORBITAS estilo Bohr ===
const orbitsConfig=[
  {r:2.8, speed:1.1,  rx:18,  ry:0,   rz:0,  ringCol:0xe63535, eCol:0xff3333, eSz:.13},
  {r:3.3, speed:-.75, rx:82,  ry:28,  rz:12, ringCol:0xf5de00, eCol:0xffd700, eSz:.11},
  {r:3.8, speed:1.4,  rx:48,  ry:55,  rz:0,  ringCol:0x4a9e2f, eCol:0x55ee22, eSz:.12},
  {r:4.3, speed:-.95, rx:22,  ry:78,  rz:35, ringCol:0xe63535, eCol:0xff6644, eSz:.10},
  {r:4.8, speed:.85,  rx:92,  ry:35,  rz:18, ringCol:0xf5de00, eCol:0xffcc00, eSz:.11},
  {r:5.4, speed:-.65, rx:62,  ry:65,  rz:50, ringCol:0x4a9e2f, eCol:0x33ff88, eSz:.09},
  {r:6.0, speed:1.2,  rx:35,  ry:90,  rz:70, ringCol:0xe63535, eCol:0xff4488, eSz:.10},
];

const electrons=[];

orbitsConfig.forEach(cfg=>{
  const orbitGroup=new THREE.Group();
  orbitGroup.rotation.x=THREE.MathUtils.degToRad(cfg.rx);
  orbitGroup.rotation.y=THREE.MathUtils.degToRad(cfg.ry);
  orbitGroup.rotation.z=THREE.MathUtils.degToRad(cfg.rz);
  atomGroup.add(orbitGroup);

  // Anillo orbital
  const ring=new THREE.Mesh(
    new THREE.TorusGeometry(cfg.r,.012,8,160),
    new THREE.MeshBasicMaterial({color:cfg.ringCol,transparent:true,opacity:.35})
  );
  orbitGroup.add(ring);

  // Electron — esfera pequeña brillante
  const eMat=new THREE.MeshBasicMaterial({color:cfg.eCol});
  const eMesh=new THREE.Mesh(new THREE.SphereGeometry(cfg.eSz,16,16),eMat);
  orbitGroup.add(eMesh);

  // Halo del electron
  const hMat=new THREE.MeshBasicMaterial({color:cfg.eCol,transparent:true,opacity:.25});
  const hMesh=new THREE.Mesh(new THREE.SphereGeometry(cfg.eSz*2.2,12,12),hMat);
  orbitGroup.add(hMesh);

  // Estela del electron (3 puntos que lo siguen)
  const trailMat=new THREE.MeshBasicMaterial({color:cfg.eCol,transparent:true});
  const trail=[];
  for(let i=1;i<=4;i++){
    const tm=new THREE.Mesh(new THREE.SphereGeometry(cfg.eSz*(1-.18*i),8,8),
      new THREE.MeshBasicMaterial({color:cfg.eCol,transparent:true,opacity:.6-.12*i}));
    orbitGroup.add(tm);trail.push(tm);
  }

  electrons.push({orbitGroup,eMesh,hMesh,trail,r:cfg.r,speed:cfg.speed,angle:Math.random()*Math.PI*2});
});

// Mouse
let tx=0,ty=0,cx=0,cy=0;
document.addEventListener("mousemove",e=>{tx=(e.clientX/W-.5)*1.4;ty=(e.clientY/H-.5)*.9;});
document.addEventListener("wheel",e=>{
  camera.position.z=Math.max(4,Math.min(16,camera.position.z+e.deltaY*.008));
},{passive:true});

let t=0;
(function loop(){
  requestAnimationFrame(loop);t+=.012;
  cx+=(tx-cx)*.05;cy+=(ty-cy)*.05;

  // Rotar atomo con mouse
  atomGroup.rotation.y=cx;
  atomGroup.rotation.x=-cy*.6;

  // Flotacion suave del nucleo
  logoGroup.position.y=Math.sin(t*.7)*.08;

  // Mover electrones en sus orbitas
  electrons.forEach(e=>{
    e.angle+=e.speed*.012;
    const x=Math.cos(e.angle)*e.r;
    const y=Math.sin(e.angle)*e.r;
    e.eMesh.position.set(x,y,0);
    e.hMesh.position.set(x,y,0);
    // Estela — posiciones pasadas
    e.trail.forEach((tm,i)=>{
      const a=e.angle-(i+1)*(.18*Math.abs(e.speed)*.012*15);
      tm.position.set(Math.cos(a)*e.r,Math.sin(a)*e.r,0);
    });
  });

  // Luces orbitando lentamente
  lA.position.x=Math.cos(t*.3)*6;lA.position.y=Math.sin(t*.25)*5;
  lB.position.x=Math.cos(t*.25+Math.PI)*6;lB.position.y=Math.sin(t*.3+1)*4;

  renderer.render(scene,camera);
})();
</script></body></html>
